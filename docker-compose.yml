version: "3.9"

# AR8: portable on any machine. The database persists to a named Docker volume
# (no hardcoded host path). Override credentials/port/data dir via a .env file
# or the environment; defaults work out of the box on a clean checkout.

services:
  rag_enterprise_starter_db:
    image: pgvector/pgvector:pg16
    container_name: rag_enterprise_starter_db
    restart: unless-stopped
    ports:
      - "${RAG_DB_HOST_PORT:-55432}:5432"
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-rag_enterprise_starter}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-rag_enterprise_starter_dev_pass}"
      POSTGRES_DB: "${POSTGRES_DB:-rag_enterprise_starter}"
    volumes:
      - rag_enterprise_pgdata:/var/lib/postgresql/data

volumes:
  rag_enterprise_pgdata:
    name: "${RAG_DB_VOLUME:-rag_enterprise_pgdata}"
