[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-enterprise-starter"
version = "0.1.0"
description = "Data layer for the three-repository Governed RAG proof of concept: FastAPI backend, pgvector retrieval, SQL-level access control."
requires-python = ">=3.10"

[tool.ruff]
target-version = "py310"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
  "E501",   # line length — formatter handles what it can; remaining are strings/URLs
  "F403",   # star imports — used throughout backend; tracked for future cleanup
  "F405",   # undefined from star imports — consequence of F403
  "B008",   # function call in default — intentional FastAPI Query() pattern
  "RUF001", # ambiguous unicode — intentional curly quotes in user-facing strings
  "SIM102", # nested if — sometimes clearer than flattened condition
  "SIM103", # return condition directly — sometimes clearer with explicit if/return
  "SIM105", # use contextlib.suppress — sometimes try/except pass is clearer
  "SIM117", # combine with statements — sometimes clearer separate
  "SIM118", # use key in dict — sometimes .keys() is intentional
  "B017",   # assertRaises(Exception) — test pattern, intentional broad catch
  "RUF012", # mutable class variable — unittest pattern, not a dataclass
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"backend/tests/**" = ["S101"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
