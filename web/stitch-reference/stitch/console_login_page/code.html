<style>
        body { font-family: 'Inter', sans-serif; }
        .glass-panel {
            background: rgba(251, 251, 230, 0.8);
            backdrop-filter: blur(24px);
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-surface text-on-surface min-h-screen flex flex-col items-center justify-center relative overflow-hidden">
<!-- Background Decor -->
<div class="absolute inset-0 z-0 overflow-hidden pointer-events-none">
<div class="absolute -top-[20%] -left-[10%] w-[60%] h-[60%] bg-primary/5 rounded-full blur-[120px]"></div>
<div class="absolute -bottom-[20%] -right-[10%] w-[60%] h-[60%] bg-tertiary-fixed/10 rounded-full blur-[120px]"></div>
</div>
<!-- Login Container -->
<main class="relative z-10 w-full max-w-[480px] px-6">
<!-- Branding Header (Based on JSON style_brand_logo/style_primary_color hints) -->
<div class="mb-12 text-center">
<span class="text-primary font-extrabold tracking-[0.2em] text-xs uppercase mb-4 block">ENTERPRISE CONSOLE</span>
<div class="flex items-center justify-center gap-2">
<div class="w-10 h-10 bg-gradient-to-br from-primary to-primary-container rounded-xl flex items-center justify-center shadow-lg shadow-primary/20">
<span class="material-symbols-outlined text-white text-2xl" style="font-variation-settings: 'FILL' 1;">dataset</span>
</div>
<span class="text-2xl font-black text-on-surface tracking-tighter">RAG Enterprise</span>
</div>
</div>
<!-- Login Card -->
<div class="bg-surface-container-lowest rounded-[2rem] p-8 md:p-12 shadow-[0px_12px_32px_rgba(30,41,55,0.06)] ring-1 ring-on-surface/[0.03]">
<div class="text-center mb-10">
<h1 class="text-3xl font-bold text-on-surface tracking-tight mb-3">Console Login</h1>
<p class="text-on-secondary-container/80 text-sm leading-relaxed max-w-[280px] mx-auto">
                    Use your organization’s SSO provider to open the enterprise console.
                </p>
</div>
<!-- Action Cluster -->
<div class="space-y-4">
<!-- Primary Action -->
<button class="w-full h-14 bg-gradient-to-r from-primary to-primary-container text-white font-semibold rounded-xl flex items-center justify-center gap-3 shadow-md transition-all active:scale-[0.98] hover:shadow-xl hover:shadow-primary/20">
<span class="material-symbols-outlined text-xl">identity_platform</span>
<span>Continue With SSO</span>
</button>
<!-- Secondary Action -->
<button class="w-full h-14 bg-surface-container text-on-surface font-medium rounded-xl flex items-center justify-center transition-all hover:bg-surface-container-high active:scale-[0.98]">
                    Request Access
                </button>
</div>
<!-- Divider (Implicit Separation Tonal Shift) -->
<div class="mt-10 pt-8 border-t border-surface-container-high/50">
<div class="flex items-start gap-3 bg-surface-container-low/50 p-4 rounded-xl">
<span class="material-symbols-outlined text-outline text-lg">info</span>
<p class="text-[11px] text-on-secondary-container leading-normal">
                        This product uses enterprise single sign-on only. Local email/password registration is intentionally disabled.
                    </p>
</div>
</div>
</div>
<!-- Footer Links (Derived from Footer JSON Component structure) -->
<footer class="mt-8 flex justify-center items-center gap-6">
<a class="text-[10px] uppercase tracking-widest text-outline hover:text-primary transition-colors" href="#">Privacy</a>
<span class="w-1 h-1 bg-outline-variant rounded-full"></span>
<a class="text-[10px] uppercase tracking-widest text-outline hover:text-primary transition-colors" href="#">Terms</a>
<span class="w-1 h-1 bg-outline-variant rounded-full"></span>
<a class="text-[10px] uppercase tracking-widest text-outline hover:text-primary transition-colors" href="#">Security</a>
</footer>
</main>
<!-- Visual Anchor: Floating decorative abstract image (Asymmetric Layout) -->
<div class="hidden lg:block absolute right-[-5%] top-[10%] w-[30%] aspect-square opacity-40">
<img alt="Abstract generative AI nodes" class="w-full h-full object-contain filter grayscale contrast-125" data-alt="Minimalist abstract visualization of data nodes and neural pathways in soft blue and white hues with translucent layers" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBINW2shwyEhwAcYx6_wuIZrTpXygdCpi2vfjfrY-NafvBD4g_5VjeYBchTQHSAew7boAsfXU1mjdHyZ1NO_V3LRTdnI7Yg5pdXZANEIhqKVSWiRqOodXJ08UdrV0fbQ5nVuRLy3TVqAdVGAgr3g9Py2YSBFuIWIv7ndTZFakURJrzqwvHu66xm86KcKral_X5Yb9WnT8H1LVsfYdDzn8Z-IRXOkN_4_y6v34Z3zwa6W9KKKp9X3HhSsbd7Phe7L6q_yUb0lPS4OwU"/>
</div>
</body></html>
