name: tests

on:
  push:
  pull_request:

jobs:
  offline:
    name: Offline tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      # No Docker, database, or model. Database-bound coverage reports explicit
      # skips; RAG_REQUIRE_DB=1 is reserved for jobs that provision Postgres.
      - name: Install
        run: pip install -r backend/requirements.txt

      - name: Run offline tests
        working-directory: backend
        run: python -m unittest discover -s tests

      - name: Reader clarity
        run: make reader-clarity-check PYTHON=python

      - name: Repository hygiene
        run: make repo-hygiene-check

  database:
    name: Database tests (disposable pgvector)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg16-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rag_enterprise_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rag_enterprise_test
      RAG_REQUIRE_DB: "1"
      EMBEDDING_PROVIDER: openai
      EMBEDDING_MODEL: text-embedding-3-small
      EMBEDDING_DIMENSIONS: "384"
      # The suite stubs embedding calls; this non-secret placeholder lets the
      # provider expose its configured dimension without contacting OpenAI.
      EMBEDDING_API_KEY: ci-placeholder-not-a-secret
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install
        run: pip install -r backend/requirements.txt

      - name: Migrate disposable database
        working-directory: backend
        run: python -m app.db.migrate

      - name: Run complete test suite
        working-directory: backend
        run: python -m unittest discover -s tests
