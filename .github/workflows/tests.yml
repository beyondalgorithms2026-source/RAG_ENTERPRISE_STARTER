name: tests

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install tools
        run: pip install ruff

      - name: Ruff check
        run: ruff check .

      - name: Ruff format
        run: ruff format --check .

  offline:
    name: Offline tests
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      # No Docker, database, or model. Database-bound coverage reports explicit
      # skips; RAG_REQUIRE_DB=1 is reserved for jobs that provision Postgres.
      - name: Install
        run: pip install -r backend/requirements.txt

      - name: Run offline tests
        working-directory: backend
        run: python -m unittest discover -s tests

      - name: Reader clarity
        run: make reader-clarity-check PYTHON=python

      - name: Repository hygiene
        run: make repo-hygiene-check

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Audit dependencies
        run: pip install pip-audit && pip install -r backend/requirements.txt && pip-audit
